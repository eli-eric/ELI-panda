version: '3.9'

networks:
  panda-net:
    driver: bridge
    name: panda-net

services:

  panda-frontend-ui-main-app:
    container_name: panda-frontend-ui-main-app
    restart: unless-stopped
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
    build:
      context: ./
      dockerfile: Dockerfile
      labels:
        - panda-frontend-ui-main-app
    networks:
      - panda-net
    ports:
      - '127.0.0.1:5000:5001'
