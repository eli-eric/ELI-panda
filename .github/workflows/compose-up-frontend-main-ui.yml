name: Compose up frontend

on:
  workflow_dispatch:

jobs:
  use-secret:
    runs-on: self-hosted
    steps:
      - name: Show secret stats
        run: |
          echo "${{ secrets.NEXTAUTH_SECRET }}" | "${{ secrets.MINIO_ACCESS_KEY_PROD }}" | "${{ secrets.MINIO_SECRET_KEY_PROD }}" | "${{ secrets.NEO4J_PASSWORD }}" | wc
  compose-up:
    runs-on: self-hosted
    needs: use-secret
    steps:
      - uses: actions/checkout@v3
      - run: |
          docker compose up -d --build
        env:
          NEXTAUTH_SECRET: '${{ secrets.NEXTAUTH_SECRET }}'
          MINIO_ACCESS_KEY_DEV: '${{ secrets.MINIO_ACCESS_KEY_PROD }}'
          MINIO_SECRET_KEY_DEV: '${{ secrets.MINIO_SECRET_KEY_PROD }}'
          NEO4J_PASSWORD: '${{ secrets.NEO4J_PASSWORD }}'
