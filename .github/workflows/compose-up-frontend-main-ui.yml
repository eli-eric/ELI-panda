name: Compose up frontend

on:
    workflow_dispatch:

jobs:
    use-secret:
        runs-on: czechia-server
        steps:
            - name: Validate required secrets are set
              env:
                  NEXTAUTH_SECRET: "${{ secrets.NEXTAUTH_SECRET }}"
                  MINIO_ACCESS_KEY_PROD: "${{ secrets.MINIO_ACCESS_KEY_PROD }}"
                  MINIO_SECRET_KEY_PROD: "${{ secrets.MINIO_SECRET_KEY_PROD }}"
                  NEO4J_PASSWORD: "${{ secrets.NEO4J_PASSWORD }}"
                  AZURE_AD_BEAMLINES_CLIENT_ID: "${{ secrets.AZURE_AD_BEAMLINES_CLIENT_ID }}"
                  AZURE_AD_BEAMLINES_CLIENT_SECRET: "${{ secrets.AZURE_AD_BEAMLINES_CLIENT_SECRET }}"
                  AZURE_AD_BEAMLINES_TENANT_ID: "${{ secrets.AZURE_AD_BEAMLINES_TENANT_ID }}"
              run: |
                  test -n "$NEXTAUTH_SECRET" || { echo "Error: NEXTAUTH_SECRET is not set."; exit 1; }
                  test -n "$MINIO_ACCESS_KEY_PROD" || { echo "Error: MINIO_ACCESS_KEY_PROD is not set."; exit 1; }
                  test -n "$MINIO_SECRET_KEY_PROD" || { echo "Error: MINIO_SECRET_KEY_PROD is not set."; exit 1; }
                  test -n "$NEO4J_PASSWORD" || { echo "Error: NEO4J_PASSWORD is not set."; exit 1; }
                  test -n "$AZURE_AD_BEAMLINES_CLIENT_ID" || { echo "Error: AZURE_AD_BEAMLINES_CLIENT_ID is not set."; exit 1; }
                  test -n "$AZURE_AD_BEAMLINES_CLIENT_SECRET" || { echo "Error: AZURE_AD_BEAMLINES_CLIENT_SECRET is not set."; exit 1; }
                  test -n "$AZURE_AD_BEAMLINES_TENANT_ID" || { echo "Error: AZURE_AD_BEAMLINES_TENANT_ID is not set."; exit 1; }
    unit-tests:
        runs-on: czechia-server
        needs: use-secret
        steps:
            - name: Checkout code
              uses: actions/checkout@v3
            - uses: actions/setup-node@v3
              with:
                  node-version: 22
            - name: Install Yarn
              run: npm install -g yarn
            - name: Install dependencies
              run: yarn install
            - name: Run unit tests
              run: yarn test
    # TODO: Enable after installing Playwright system deps on runner (sudo npx playwright install-deps chromium)
    # e2e-tests:
    #     runs-on: czechia-server
    #     needs: unit-tests
    #     steps:
    #         - name: Checkout code
    #           uses: actions/checkout@v3
    #         - uses: actions/setup-node@v3
    #           with:
    #               node-version: 18
    #         - name: Install Yarn
    #           run: npm install -g yarn
    #         - name: Install dependencies
    #           run: yarn install
    #         - name: Clean old Playwright browsers
    #           run: rm -rf ~/.cache/ms-playwright
    #         - name: Install Playwright browsers
    #           run: npx playwright install chromium
    #         - name: Run E2E tests
    #           run: yarn e2e
    #         - name: Upload E2E report
    #           uses: actions/upload-artifact@v4
    #           if: ${{ !cancelled() }}
    #           with:
    #               name: playwright-report
    #               path: playwright-report/
    #               retention-days: 14
    compose-up:
        runs-on: czechia-server
        needs: unit-tests
        steps:
            - uses: actions/checkout@v3
            - run: |
                  docker compose up -d --build
              env:
                  NEXTAUTH_SECRET: '${{ secrets.NEXTAUTH_SECRET }}'
                  MINIO_ACCESS_KEY_PROD: '${{ secrets.MINIO_ACCESS_KEY_PROD }}'
                  MINIO_SECRET_KEY_PROD: '${{ secrets.MINIO_SECRET_KEY_PROD }}'
                  NEO4J_PASSWORD: '${{ secrets.NEO4J_PASSWORD }}'
                  AZURE_AD_BEAMLINES_CLIENT_ID: '${{ secrets.AZURE_AD_BEAMLINES_CLIENT_ID }}'
                  AZURE_AD_BEAMLINES_CLIENT_SECRET: '${{ secrets.AZURE_AD_BEAMLINES_CLIENT_SECRET }}'
                  AZURE_AD_BEAMLINES_TENANT_ID: '${{ secrets.AZURE_AD_BEAMLINES_TENANT_ID }}'
