name: Compose up frontend MAIN UI APP

on:
  workflow_dispatch:

defaults:
  run:
    working-directory: frontend/ui-main-app

jobs:
  use-secret:
    runs-on: self-hosted
    steps:
      - name: Show secret stats
        run: |
          echo "${{ secrets.NEXTAUTH_SECRET }}" | wc
  compose-up:
    runs-on: self-hosted
    needs: check-secret
    if: needs.check-secret.outputs.secret_present == 'true'
    steps:
      - uses: actions/checkout@v3
      - run: |
          docker-compose up -d --build
        working-directory: frontend/ui-main-app
        env:
          NEXTAUTH_SECRET: "${{ secrets.NEXTAUTH_SECRET }}"
