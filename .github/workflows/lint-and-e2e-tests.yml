name: Lint and test

on:
  - push

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🏷️
        uses: actions/checkout@v3

      - name: Use Node 18 🕹️
        uses: actions/setup-node@v3
        with:
          cache: 'yarn'
          cache-dependency-path: ./yarn.lock
          node-version: '18'

      - name: Install ⚙️
        run: yarn install

      - name: Lint 🤓
        run: yarn lint

