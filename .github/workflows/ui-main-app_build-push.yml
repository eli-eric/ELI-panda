name: ui-main-app build & push

on:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: ./frontend/ui-main-app

jobs:
#  lint-test:
#    uses: ./.github/workflows/lint-test.yml
#    name: Preflight checks

  build-push:
#    needs: [lint-test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push 
        uses: docker/build-push-action@v3.2.0
        with:
          context: ./frontend/ui-main-app/.
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/panda-ui-main-app:latest
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/panda-ui-main-app:latest
          cache-to: type=inline
          # build-args: |
          #   PANDA_API_GW_URL=http://localhost:5001/api/mock-server
