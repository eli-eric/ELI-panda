name: Cypress all in one docker

on: workflow_dispatch

defaults:
  run:
    working-directory: frontend/ui-main-app
env:
  NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}

jobs:
  build-run-test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: frontend/ui-main-app
    steps:
      - uses: actions/checkout@v3
      - name: Build the Docker compose
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
        run: docker-compose -f docker/cypress-all-in-container/docker-compose.yaml up --build
