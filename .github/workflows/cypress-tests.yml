name: Cypress Tests

on: [push]

defaults:
  run:
    working-directory: frontend/ui-main-app

jobs:
  cypress-run:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      # Install NPM dependencies, cache them correctly
      - name: Set up pnpm
        uses: pnpm/action-setup@v2.0.1
        with:
          version: 6
          # Only install what we need to run the client in-action and tests against it
          # format:    `--filter <packagename>...`
          run_install: true
      # and run all Cypress tests
      - name: Cypress run
        uses: cypress-io/github-action@v4.2.1 # use the explicit version number
        with:
          install: false
          build: yarn build
          start: yarn start
          wait-on: http://localhost:5001