version: '3.9'

networks:
  panda-net-test:
    driver: bridge
    name: panda-net-test

services:
  panda-frontend-ui-main-app-test:
    container_name: panda-frontend-ui-main-app-test
    restart: unless-stopped
    environment:
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - MINIO_ACCESS_KEY_TEST=${MINIO_ACCESS_KEY_TEST}
      - MINIO_SECRET_KEY_TEST=${MINIO_SECRET_KEY_TEST}
    build:
      context: ./
      dockerfile: Dockerfile.testenv
      labels:
        - panda-frontend-ui-main-app-test
    networks:
      - panda-net-test
    ports:
      - '127.0.0.1:5100:5001'
