definitions:
  models.AuthUser:
    properties:
      displayName:
        type: string
      email:
        type: string
      id:
        type: integer
      photoURL:
        type: string
      role:
        items:
          type: string
        type: array
      token:
        type: string
      uid:
        type: string
    type: object
info:
  contact:
    email: jiri.svacha@eli-beams.eu
    name: Jiří Švácha
  description: This is a API Gateway to the PANDA database
  title: PANDA API Gateway
  version: "0.1"
paths:
  /authenticate:
    get:
      consumes:
      - application/json
      description: Get authenticated user data by token - Bearer auth header
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AuthUser'
      security:
      - ApiKeyAuth: []
      summary: Get authenticated user data
      tags:
      - Security
    post:
      consumes:
      - application/json
      description: Login with username and password and get jwt token to play with
        rest of API
      parameters:
      - description: username
        in: formData
        name: username
        required: true
        type: string
      - description: password
        in: formData
        name: password
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: ""
      summary: Login and get security token
      tags:
      - Security
  /catalogue/test:
    get:
      consumes:
      - application/json
      description: Test
      produces:
      - application/json
      responses:
        "200":
          description: ""
      summary: Test
      tags:
      - Catalogue
  /system:
    post:
      consumes:
      - application/json
      description: Create new system and return new System ID
      produces:
      - application/json
      responses:
        "200":
          description: ""
      security:
      - ApiKeyAuth: []
      summary: Create new system
      tags:
      - Systems
    put:
      consumes:
      - application/json
      description: Update System by id
      produces:
      - application/json
      responses:
        "200":
          description: ""
      security:
      - ApiKeyAuth: []
      summary: Update System
      tags:
      - Systems
  /system/relationship/hierarchical:
    post:
      consumes:
      - application/json
      description: Create new hierarchical relationship between two existing Systems.
        You can pass existing System id, uid or name(be careful because the name could
        not be unique)
      produces:
      - application/json
      responses:
        "200":
          description: ""
      security:
      - ApiKeyAuth: []
      summary: Create new hierarchical relationship between two existing Systems
      tags:
      - Systems
  /system/subsystem:
    post:
      consumes:
      - application/json
      description: Create new subsystem as child of and existing System. You can pass
        existing System id, uid or name(be careful because the name could not be unique)
      produces:
      - application/json
      responses:
        "200":
          description: ""
      security:
      - ApiKeyAuth: []
      summary: Create new subsystem
      tags:
      - Systems
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
