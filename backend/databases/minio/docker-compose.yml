version: '3.9'

networks:
  panda-net:
    name: panda-net
    driver: bridge

services:
  minio1:
    restart: unless-stopped
    user: 1002:1002
    networks:
      - panda-net
    ports:
    - 9000:9000
    - 9090:9090
    image: minio/minio:RELEASE.2022-10-08T20-11-00Z@sha256:c965b33ac3defb9109d5c748e4adcc2f623a949b93d9fa88a0d6c71dfc1f748e
    volumes:
    - $HOME/minio/data:/data:rw
    - $HOME/minio/certs:/certs:rw
    environment:
    - "MINIO_ROOT_USER=admin"
    - "MINIO_ROOT_PASSWORD=fw34-sdRF"
    - "MINIO_SERVER_URL=https://panda.eli-beams.eu:9000" # - "MINIO_SERVER_URL=https://minio1:9000"
    command: server /data --console-address ":9090" --certs-dir "/certs"


